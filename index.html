<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express Osorno</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fffcf0; /* Fondo crema como tu sketch */
            font-family: Arial, sans-serif;
        }

        /* --- SECCIÓN HERO --- */
        .hero-container {
            width: 100%;
            line-height: 0; /* Elimina espacios residuales debajo de la imagen */
        }

        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- SECCIÓN BOTÓN WHATSAPP --- */
        .cta-container {
            text-align: center;
            padding: 40px 0;
        }

        .btn-whatsapp {
            background-color: #78e08f; /* El verde suave de tu sketch */
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        .btn-whatsapp:hover {
            background-color: #61b373;
        }

        /* --- SECCIÓN PROYECTOS --- */
        .proyectos-titulo {
            text-align: center;
            font-size: 28px;
            color: #2d3436;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .grid-proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .grid-proyectos img {
            width: 100%;
            height: auto;
            border-radius: 0; /* Rectangulares como en tu sketch */
            display: block;
        }

        /* Ajuste para móvil */
        @media (max-width: 600px) {
            .grid-proyectos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <img src="hero-reloj.jpg" alt="Reloj Express" class="hero-img">
    </div>

    <div class="cta-container">
        <a href="https://wa.me/tu_numero_aqui" class="btn-whatsapp">
            ✉ AGENDAR POR WHATSAPP
        </a>
    </div>

    <h2 class="proyectos-titulo">Proyectos Terminados</h2>
    
    <div class="grid-proyectos">
        <img src="proyectos/reloj1.jpg" alt="Proyecto 1">
        <img src="proyectos/reloj2.jpg" alt="Proyecto 2">
        <img src="proyectos/reloj3.jpg" alt="Proyecto 3">
        <img src="proyectos/reloj4.jpg" alt="Proyecto 4">
    </div>

</body>
</html>
