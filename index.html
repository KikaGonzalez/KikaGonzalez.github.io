<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express Osorno | Excelencia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050a0f;
            --accent: #E67E22;
            --text-main: #f8f9fa;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background: radial-gradient(circle at top right, #0d1b2a 0%, #050a0f 60%);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        /* --- MEJORA DEL LOGO --- */
        .logo-container {
            background: transparent;
            padding: 5px;
        }

        .logo-container img {
            height: 110px; /* Tamaño imponente */
            width: auto;
            display: block;
            /* Si tiene cuadros blancos/grises, esto ayuda a suavizarlos contra el fondo oscuro */
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        .nav-socials a {
            color: white;
            margin-left: 20px;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 100px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .cta-button {
            background-color: var(--accent);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 20px;
        }

        /* --- GALERÍA RESISTENTE --- */
        .portfolio {
            padding: 80px 8%;
        }

        .portfolio h2 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: #101c2b; /* Fondo de respaldo por si la foto falla */
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Si la imagen no carga, este texto se verá */
            color: #444;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="logo.png" alt="Reloj Express Osorno">
        </div>
        <div class="nav-socials">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
    </nav>

    <section class="hero">
        <h1>Excelencia en <br>Cada Segundo</h1>
        <p>Servicio técnico especializado en Osorno y La Unión.</p>
        <a href="#" class="cta-button">Agendar Servicio</a>
    </section>

    <section class="portfolio">
        <h2>Trabajos Recientes</h2>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="reloj1.jpg" alt="Reloj 1"></div>
            <div class="gallery-item"><img src="reloj2.jpg" alt="Reloj 2"></div>
            <div class="gallery-item"><img src="reloj3.jpg" alt="Reloj 3"></div>
            <div class="gallery-item"><img src="reloj4.jpg" alt="Reloj 4"></div>
        </div>
    </section>

    <footer>
        RELOJ EXPRESS OSORNO &copy; 2026
    </footer>

</body>
</html>
