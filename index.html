<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express - Osorno</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #000; color: white; }

        /* Contenedor principal del Hero */
        .hero {
            position: relative;
            width: 100%;
            min-height: 80vh; /* Ajusta la altura al 80% de la pantalla */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero-reloj.jpg');
            background-size: cover; /* Cambia a 'contain' si quieres ver la imagen completa sin recortes, aunque dejará bordes */
            background-position: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .logo {
            width: 150px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 20px 0;
            font-family: 'Serif', Georgia, serif;
        }

        /* Botón de WhatsApp */
        .btn-whatsapp {
            background-color: #64d26d;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s;
        }

        .btn-whatsapp:hover {
            transform: scale(1.05);
        }

        /* Galería de Trabajos Realizados */
        .galeria {
            padding: 50px 20px;
            text-align: center;
        }

        .grid-proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-proyectos img {
            width: 100%;
            height: 300px;
            object-fit: cover; /* Mantiene la proporción de los relojes en la galería */
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <img src="logo.png" alt="Reloj Express Osorno" class="logo">
        
        <a href="https://wa.me/tunúmero" class="btn-whatsapp">
            <span>AGENDAR POR WHATSAPP</span>
        </a>

        <h1>Excelencia en<br>Cada Segundo</h1>
        <p>Servicio técnico de precisión en Osorno y La Unión.</p>
    </section>

    <section class="galeria">
        <h2 style="color: #d4a373;">Trabajos Realizados</h2>
        <div class="grid-proyectos">
            <img src="proyectos/reloj1.jpg" alt="Trabajo 1">
            <img src="proyectos/reloj2.jpg" alt="Trabajo 2">
            <img src="proyectos/reloj3.jpg" alt="Trabajo 3">
            <img src="proyectos/reloj4.jpg" alt="Trabajo 4">
        </div>
    </section>

</body>
</html>
