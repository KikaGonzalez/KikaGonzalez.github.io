<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express Osorno - Servicio Técnico Profesional</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos Globales */
        :root {
            --cream-bg: #fffcf0; /* Fondo crema de la parte inferior */
            --green-whatsapp: #25D366; /* Verde oficial de WhatsApp */
            --dark-blue: #0a1128; /* Un azul más profundo y elegante */
            --gold-text: #bfa071; /* Dorado suave para el subtítulo */
            --dark-text: #1a1a1a; /* Negro suave para los títulos */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SECCIÓN HERO --- */
        .hero {
            background-color: var(--dark-blue);
            color: white;
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }

        /* Logo superior */
        .main-logo {
            width: 180px; /* Tamaño del logo en tu sketch */
            margin-bottom: 40px;
        }

        /* Título Principal: Usamos Playfair Display para elegancia */
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem; /* Grande y elegante */
            margin-bottom: 25px;
            line-height: 1.1;
        }

        /* Subtítulo: Un dorado suave para el contraste */
        .hero .subtitle {
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
            color: var(--gold-text);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* --- SECCIÓN PORTFOLIO --- */
        .portfolio {
            background-color: var(--cream-bg);
            padding: 80px 20px;
            text-align: center;
        }

        /* Título de la Sección */
        .portfolio h2 {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: var(--dark-text);
            margin-bottom: 50px;
        }

        /* Grid de Imágenes de Proyectos */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas */
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Contenedor de cada imagen de proyecto */
        .project-item {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilo de las imágenes: object-fit cover mantiene la proporción */
        .project-img {
            width: 100%;
            height: 350px; /* Altura uniforme para todas */
            object-fit: cover;
            border-radius: 4px; /* Un borde muy sutil */
        }

        /* --- BOTÓN DE WHATSAPP --- */
        .btn-whatsapp {
            background-color: var(--green-whatsapp);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px; /* Totalmente redondeado */
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px; /* Espacio entre icono y texto */
            margin-top: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* SVG del Icono de WhatsApp */
        .whatsapp-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* --- MEDIA QUERIES (PARA MÓVILES) --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero .subtitle { font-size: 1rem; }
            .projects-grid { grid-template-columns: 1fr; } /* Un solo proyecto por fila en móvil */
            .project-img { height: 250px; }
        }

    </style>
</head>
<body>

    <section class="hero">
        <img src="logo.png" alt="Reloj Express Osorno" class="main-logo">
        
        <h1>Excelencia en<br>Cada Segundo</h1>
        <p class="subtitle">
            Servicio técnico de precisión en Osorno y La Unión. Mantención de pilas, correas y restauración de piezas finas con total seguridad.
        </p>
    </section>

    <section class="portfolio">
        <h2>Proyectos Terminados</h2>
        
        <div class="projects-grid">
            <div class="project-item">
                <img src="reloj1.jpg" alt="Reloj Clásico 1" class="project-img">
            </div>
            
            <div class="project-item">
                <img src="reloj2.jpg" alt="Reloj Clásico 2" class="project-img">
            </div>
            
            <div class="project-item">
                <img src="reloj3.jpg" alt="Reloj Clásico 3" class="project-img">
            </div>
        </div>

        <a href="#" class="btn-whatsapp">
            <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L3.9 480l117.7-30.9c32.4 17.7 68.9 27 106.3 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.4-8.6-44.6-27.6-16.5-14.7-27.6-32.8-30.8-38.4-3.2-5.6-.3-8.6 2.5-11.4 2.5-2.5 5.6-6.5 8.3-9.7 2.8-3.3 3.7-5.6 5.5-9.3 1.9-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.7 23.5 9.2 31.6 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
            AGENDAR POR WHATSAPP
        </a>
    </section>

</body>
</html>
