<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express Osorno | Servicio Técnico</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* VARIABLES: Modifica los colores aquí fácilmente */
        :root {
            --fondo: #050a0f;
            --naranja-marca: #E67E22;
            --verde-whatsapp: #25d366;
            --blanco: #ffffff;
            --gris-suave: #a0a8b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--fondo);
            color: var(--blanco);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
        }

        /* --- BLOQUE 1: IMAGEN PRINCIPAL (HERO) --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 70vh; /* Altura de la imagen principal */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d1b2a; /* Color de fondo si la imagen falla */
        }

        /* Contenedor de la imagen hero para asegurar que cargue */
        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Oscurece un poco la imagen para que el botón resalte */
            z-index: 2;
        }

        .btn-whatsapp {
            position: relative;
            z-index: 3;
            background-color: var(--verde-whatsapp);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s transform ease;
        }

        .btn-whatsapp:hover { transform: scale(1.05); }

        /* --- BLOQUE 2: GALERÍA DE TRABAJOS --- */
        .galeria-container {
            padding: 60px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .galeria-titulo {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--naranja-marca);
        }

        .grid-relojes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .tarjeta-reloj {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tarjeta-reloj img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Icono que aparece si la imagen no carga */
        .tarjeta-reloj::before {
            content: "\f017"; /* Icono de reloj font-awesome */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            z-index: 0;
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            color: var(--gris-suave);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* Ajustes para Celulares */
        @media (max-width: 600px) {
            .hero-section { min-height: 50vh; }
            .btn-whatsapp { font-size: 1rem; padding: 15px 25px; }
            .galeria-titulo { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <img src="hero-reloj.jpg" alt="Reloj Express Osorno" class="hero-bg" onerror="this.style.display='none'">
        <div class="hero-overlay"></div>
        
        <a href="https://wa.me/569XXXXXXXX" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i>
            AGENDAR POR WHATSAPP
        </a>
    </header>

    <main class="galeria-container">
        <h2 class="galeria-titulo">Trabajos Realizados</h2>
        
        <div class="grid-relojes">
            <div class="tarjeta-reloj">
                <img src="reloj1.jpg" alt="Trabajo 1">
            </div>
            <div class="tarjeta-reloj">
                <img src="reloj2.jpg" alt="Trabajo 2">
            </div>
            <div class="tarjeta-reloj">
                <img src="reloj3.jpg" alt="Trabajo 3">
            </div>
            <div class="tarjeta-reloj">
                <img src="reloj4.jpg" alt="Trabajo 4">
            </div>
        </div>
    </main>

    <footer>
        <p>RELOJ EXPRESS OSORNO &copy; 2026</p>
        <p>Expertos en Pilas, Correas y Mantención</p>
    </footer>

</body>
</html>
