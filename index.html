<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Express Osorno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --azul-oscuro: #050a0f;
            --naranja: #E67E22;
            --blanco: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--azul-oscuro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--blanco);
        }

        /* --- SECCIÓN PRINCIPAL (HERO) --- */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Ocupa toda la pantalla */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Aquí cargamos tu imagen nueva */
            background: url('hero-reloj.jpg') no-repeat center center;
            background-size: cover;
        }

        /* Capa oscura suave para que el botón resalte más */
        .hero-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); 
            z-index: 1;
        }

        /* --- BOTÓN DE WHATSAPP FLOTANTE O CENTRAL --- */
        .cta-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 300px; /* Ajusta esto para mover el botón arriba o abajo sobre la imagen */
        }

        .btn-whatsapp {
            background-color: #25d366; /* Verde oficial WhatsApp */
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .btn-whatsapp:hover {
            transform: scale(1.05);
            background-color: #128c7e;
        }

        /* Footer sencillo */
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.7;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="cta-wrapper">
            <a href="https://wa.me/569XXXXXXXX" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
                AGENDAR SERVICIO
            </a>
        </div>
        
        <footer>
            RELOJ EXPRESS OSORNO - SERVICIO TÉCNICO PROFESIONAL
        </footer>
    </div>

</body>
</html>
